async function upDoc(file, refId, refTipo) {
  if(!file) return null;
  const ext = file.name.split('.').pop();
  const path = refTipo+'/'+refId+'/'+Date.now()+'-'+file.name.replace(/[^a-zA-Z0-9.-]/g,'_');
  // Upload to storage
  const fd = new FormData(); fd.append('',file);
  const r = await fetch(SBU+'/storage/v1/object/documentos/'+path,{
    method:'POST', headers:{'apikey':SBK,'Authorization':'Bearer '+SBK},
    body: file
  });
  if(!r.ok) { const e=await r.text(); console.error('Upload err:',e); ntf('Erro no upload: '+r.status,'#e05c5c'); return null; }
  const url = SBU+'/storage/v1/object/public/documentos/'+path;
  // Save to documentos table
  await SB.from('documentos').insert({
    nome: file.name, url: url, tamanho: file.size,
    tipo: file.type, referencia_id: refId, referencia_tipo: refTipo,
    criado_por: S&&S.d&&S.d.nome
  });
  return url;
}

async function handleUpload(inputId, refId, refTipo, listId) {
  const inp = document.getElementById(inputId);
  if(!inp || !inp.files || !inp.files.length) return;
  const area = inp.closest('.upload-area');
  if(area) area.classList.add('uploading');
  ntf('Enviando arquivo...');
  for(const file of inp.files) {
    await upDoc(file, refId, refTipo);
  }
  ntf('Arquivo enviado!', '#4caf82');
  if(area) area.classList.remove('uploading');
  if(listId) await loadDocs(refId, refTipo, listId);
}

async function delDoc(docId, refId, refTipo, containerId) {
  if(!confirm('Remover este anexo?')) return;
  await SB.from('documentos').delete().eq('id', docId);
  ntf('Anexo removido');
  await loadDocs(refId, refTipo, containerId);
}

async function executarBusca(){
  var q=(document.getElementById('_bq')&&document.getElementById('_bq').value||'').trim().toLowerCase();
  if(!q||q.length<2){ntf('Digite ao menos 2 caracteres.');return;}
  var el=document.getElementById('_bres');
  if(!el)return;
  el.innerHTML='<div style="text-align:center;padding:30px;color:var(--gray)">Buscando...</div>';
  var results=[];

  // Demandas (D.d)
  (D.d||[]).forEach(function(d){
    if((d.titulo||'').toLowerCase().includes(q)||(d.descricao||'').toLowerCase().includes(q)){
      var ass=D.u.find(function(u){return u.id===d.assessor_id;});
      results.push({mod:'Demanda',icon:'&#128203;',color:'#4a90d9',
        titulo:d.titulo,sub:(ass?ass.nome+' &bull; ':'')+(d.status||''),
        onclick:"switchDemTab('ativas');nv('dem')"});
    }
  });

  // Protocolos (D.p)
  (D.p||[]).forEach(function(p){
    if((p.titulo||'').toLowerCase().includes(q)||('#'+p.numero).includes(q)||(p.descricao||'').toLowerCase().includes(q)){
      results.push({mod:'Protocolo',icon:'&#128235;',color:'#c9a84c',
        titulo:'#'+p.numero+' '+(p.titulo||''),sub:p.status||'',
        onclick:"nv('prot')"});
    }
  });

  // Módulos TB com chaves corretas do objeto D
  var mods=[
    {key:'j',label:'Processo Judicial',icon:'&#9878;&#65039;',color:'#9b59b6',nv:'pj'},
    {key:'l',label:'Licita\u00e7\u00e3o',icon:'&#128196;',color:'#27ae60',nv:'lic'},
    {key:'c',label:'Contrato',icon:'&#128221;',color:'#e09440',nv:'con'},
    {key:'pr',label:'Parecer',icon:'&#128209;',color:'#4caf82',nv:'par'},
    {key:'o',label:'Of\u00edcio',icon:'&#9993;&#65039;',color:'#4a90d9',nv:'ofi'},
    {key:'ae',label:'PAE',icon:'&#128274;',color:'#e05c5c',nv:'pae'},
    {key:'pl',label:'Projeto de Lei',icon:'&#128196;',color:'#8e44ad',nv:'prj'}
  ];
  mods.forEach(function(m){
    (D[m.key]||[]).forEach(function(r){
      var txt=JSON.stringify(r).toLowerCase();
      if(txt.includes(q)){
        var titulo=r.numero?(r.numero+' \u2014 '+(r.titulo||r.objeto||r.assunto||r.ementa||'')):(r.titulo||r.objeto||r.assunto||r.ementa||r.numero||'');
        results.push({mod:m.label,icon:m.icon,color:m.color,
          titulo:titulo,sub:r.status||'',onclick:"nv('"+m.nv+"')"});
      }
    });
  });

  if(!results.length){
    el.innerHTML='<p style="text-align:center;padding:40px;color:var(--gray)">Nenhum resultado para "'+q+'".</p>';
    return;
  }
  el.innerHTML='<div style="font-size:12px;color:var(--gray);margin-bottom:12px">'+results.length+' resultado(s) para "'+q+'"</div>'+
    results.map(function(r){
      return '<div onclick="'+r.onclick+'" style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.07);margin-bottom:8px;cursor:pointer;background:rgba(255,255,255,.02)" onmouseover="this.style.background=\'rgba(255,255,255,.06)\'" onmouseout="this.style.background=\'rgba(255,255,255,.02)\'">'+
        '<div style="font-size:20px">'+r.icon+'</div>'+
        '<div style="flex:1"><div style="font-size:13px;font-weight:600">'+(r.titulo||'').slice(0,80)+'</div>'+
        '<div style="font-size:11px;color:var(--gray)">'+r.mod+(r.sub?' &bull; '+r.sub:'')+'</div></div>'+
        '<div style="font-size:10px;color:'+r.color+';font-weight:700;background:rgba(255,255,255,.05);padding:3px 8px;border-radius:10px">'+r.mod+'</div>'+
      '</div>';
    }).join('');
}

function filtrarPrj(q){
  q=q.toLowerCase();
  var rows=window._prjRows||[];
  var filtered=q?rows.filter(function(r){
    return (r.ementa||'').toLowerCase().includes(q)||
           (r.numero_pgm||'').toLowerCase().includes(q)||
           (r.numero_camara||'').toLowerCase().includes(q)||
           (r.obs||'').toLowerCase().includes(q)||
           (r.autor||'').toLowerCase().includes(q);
  }):rows;
  var tbody=document.getElementById('_prj_tbody');
  if(!tbody)return;
  // Re-render only filtered rows count info
  var info=document.querySelector('#_prj_tabela')&&document.querySelector('.tb p');
  if(info)info.textContent=(q?filtered.length+' de '+rows.length:rows.length)+' projeto(s)';
  // Just hide/show rows
  var trs=tbody.querySelectorAll('tr');
  var rowIdx=0;
  trs.forEach(function(tr){
    if(tr.cells&&tr.cells.length>2){
      var show=!q||filtered.some(function(r){
        return tr.innerHTML.includes(r.id);
      });
      tr.style.display=show?'':'none';
    }
  });

function calcPrazoSancao(dataRetorno){
  if(!dataRetorno)return null;
  var d=new Date(dataRetorno);
  if(isNaN(d.getTime()))return null;
  var uteis=0,current=new Date(d);
  current.setDate(current.getDate()+1);
  while(uteis<15){
    var dow=current.getDay();
    if(dow!==0&&dow!==6)uteis++;
    if(uteis<15)current.setDate(current.getDate()+1);
  }
  return current;
}

colo Num: "+r2.numero+"</div>"+"<div class=grid>"+"<div class=f><div class=lb>Data e Hora</div><div class=vl>"+dt+"</div></div>"+"<div class=f><div class=lb>Status</div><div class=vl>"+(r2.status==="entregue"?"Entregue":"Pendente")+"</div></div></div>"+"<div class=f><div class=lb>Secretaria de Origem</div><div class=vl>"+r2.secretaria+"</div></div>"+"<div class=grid>"+"<div class=f><div class=lb>Portador</div><div class=vl>"+r2.entregue_por+"</div></div>"+"<div class=f><div class=lb>Cargo</div><div class=vl>"+(r2.cargo_portador||"-")+"</div></div></div>"+"<div class=f><div class=lb>Descricao do Documento</div><div class=vl style=min-height:50px>"+r2.descricao+"</div></div>"+"<div class=grid>"+"<div class=f><div class=lb>Destino</div><div class=vl>"+(r2.destino||"-")+"</div></div>"+"<div class=f><div class=lb>Recebido por (PGM)</div><div class=vl>"+r2.recebido_por+"</div></div></div>"+(r2.obs?"<div class=f><div class=lb>Observacoes</div><div class=vl>"+r2.obs+"</div></div>":"")+"<div class=ft><div class=sigs>"+"<div class=sig>_________________________<br>"+r2.recebido_por+"<br><small>Recebido por - PGM</small></div>"+"<div class=sig>_________________________<br>"+r2.entregue_por+"<br><small>Portador / Entregante</small></div>"+"</div><div class=stamp>Sistema PGM Extrema - "+dt+"</div></div>"+"<button class=btn onclick=window.print()>Imprimir / Salvar como PDF</button>"+"</body></html>");win.document.close();}

function criarDemandaRecibo(id,num,desc,sec){const titulo="Protocolo #"+num+" - "+decodeURIComponent(desc).slice(0,60);sM("<div class=\"md\"><div class=\"mh\"><h3>Criar Demanda a partir do Protocolo</h3><button class=\"mx\" onclick=\"cM()\">x</button></div>"+"<div class=\"mb\"><div style=\"background:rgba(74,144,217,.08);border:1px solid rgba(74,144,217,.2);border-radius:8px;padding:10px 14px;margin-bottom:14px\">"+"<div style=\"font-size:11px;color:#4a90d9;font-weight:600;margin-bottom:2px\">Protocolo #"+num+"</div>"+"<div style=\"font-size:12px\">"+decodeURIComponent(desc).slice(0,80)+"</div>"+"<div style=\"font-size:11px;color:var(--gray)\">Secretaria: "+sec+"</div></div>"+"<div class=\"fr\"><div class=\"fi ff\"><label>Titulo da Demanda *</label><input id=\"_cdt\" value=\""+titulo+"\"></div>"+"<div class=\"fi\"><label>Assessor Responsavel *</label><select id=\"_cda\"><option value=\"\">Selecione...</option>"+D.u.map(u=>"<option value=\""+u.id+"\">"+u.nome+"</option>").join("")+"</select></div>"+"<div class=\"fi\"><label>Prazo</label><input type=\"date\" id=\"_cdp\"></div>"+"<div class=\"fi\"><label>Prioridade</label><select id=\"_cdpr\"><option value=\"normal\">Normal</option><option value=\"alta\">Alta</option><option value=\"urgente\">Urgente</option></select></div>"+"<div class=\"fi ff\"><label>Instrucoes</label><textarea id=\"_cdo\" rows=\"3\"></textarea></div>"+"</div></div>"+"<div class=\"mf\"><button class=\"bn bs\" onclick=\"cM()\">Cancelar</button>"+"<button class=\"bn bp\" data-rid=\""+id+"\" onclick=\"salvarDemandaRecibo(this.dataset.rid)\">Criar e Encaminhar</button></div></div>");}
async function salvarDemandaRecibo(reciboId){const titulo=document.getElementById("_cdt").value.trim();const aId=document.getElementById("_cda").value;const prazo=document.getElementById("_cdp").value||null;const prio=document.getElementById("_cdpr").value;const obs=document.getElementById("_cdo").value.trim();if(!titulo||!aId){ntf("Preencha titulo e assessor.","#e05c5c");return}const{data:dem,error}=await SB.from("demandas").insert({titulo,assessor_id:aId,prazo,prioridade:prio,obs:obs||null,status:"pendente"}).select().single();if(error){ntf("Erro: "+error.message,"#e05c5c");return}const{data:anx}=await SB.from("anexos").select("*").eq("referencia_id",reciboId).eq("referencia_tipo","recibo");if(anx&&anx.length>0){for(const a of anx)await SB.from("anexos").insert({nome:a.nome,url:a.url,tamanho:a.tamanho,tipo:a.tipo,referencia_id:dem.id,referencia_tipo:"demanda",criado_por:S.d&&S.d.nome});}cM();await lA();ntf("Demanda criada e encaminhada!");nv("dem");}

async function salvarDocsRecibo(id){
  const fi=document.getElementById("_adfile");
  if(!fi||!fi.files||fi.files.length===0){ntf("Selecione pelo menos um arquivo.","#e05c5c");return}
  ntf("Enviando documentos...");
  let ok=0;
  for(const f of Array.from(fi.files)){
    const path="recibos/"+id+"/"+Date.now()+"_"+f.name;
    const{error}=await SB.storage.from("documentos").upload(path,f,{upsert:true});
    if(!error){
      const{data:pu}=SB.storage.from("documentos").getPublicUrl(path);
      await SB.from("anexos").insert({nome:f.name,url:pu.publicUrl,tamanho:f.size,tipo:f.type,referencia_id:id,referencia_tipo:"recibo",criado_por:S.d&&S.d.nome});
      ok++;
    }
  }
  cM();
  ntf(ok+" documento(s) adicionado(s) com sucesso!");
}
async function delRecibo(id){
  if(!confirm("Excluir este protocolo? Esta acao nao pode ser desfeita."))return;
  // Delete associated annexes first
  await SB.from("anexos").delete().eq("referencia_id",id).eq("referencia_tipo","recibo");
  // Delete the record
  const{error}=await SB.from("recibos_fisicos").delete().eq("id",id);
  if(error){ntf("Erro ao excluir: "+error.message,"#e05c5c");return}
  ntf("Protocolo excluido.");
  rRecibo(document.getElementById("ct"));
}
async function trfDem(demId){
  const sel=document.getElementById("_trf_"+demId);
  const aId=sel&&sel.value;
  if(!aId){ntf("Selecione um assessor para transferir.","#e05c5c");return}
  const aName=sel.options[sel.selectedIndex].text;
  if(!confirm("Transferir esta demanda para "+aName+"?"))return;
  const{error}=await SB.from("demandas").update({assessor_id:aId}).eq("id",demId);
  if(error){ntf("Erro: "+error.message,"#e05c5c");return}
  await lA();
  ntf("Demanda transferida para "+aName+"!");
  nv("mdem");
}
